name: Clangd-Tidy

on: push

permissions:
  contents: read
  packages: read  # Needed to pull from GHCR if private


jobs:
  clang-tidy-check:
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/hitthesurf/music_player/unit_tests:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}    

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Clangd Tidy
      run: cmake --preset="unit-tests.gcc.linux" --fresh && cd scripts && python3 ./clangd_tidy_check.py gcc.linux

