name: Build STM32 Firmware
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-stm32-firmware-nucleo:
    name: Build STM32 Nucleo Binaries
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mark-pearson-bluefruit/stm32cubeclt:1.16.0
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Build Firmware
        run: cd scripts && ./build_nucleo_stm32h7_firmware.sh
      - name: Rename and copy files
        run: |
          mkdir stm32-firmware
          cp build/vs.firmware-nucleo/firmware/targets/nucleoh7a3zit6q/nucleoh7a3zit6q.elf stm32-firmware/nucleoh7a3ziq.elf
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32-firmware-music-player
          path: stm32-firmware
  build-stm32-firmware-rev1:
    name: Build STM32 Rev1 Binaries
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mark-pearson-bluefruit/stm32cubeclt:1.16.0
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Build Firmware
        run: cd scripts && ./build_rev1_stm32h5_firmware.sh
      - name: Rename and copy files
        run: |
          mkdir stm32-firmware
          cp build/vs.firmware-rev1/firmware/targets/rev1/rev1.elf stm32-firmware/rev1.elf
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32-firmware-music-player
          path: stm32-firmware  